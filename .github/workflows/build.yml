name: build

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      plakar: ${{ steps.plakar.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install plakar
        id: plakar
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "$REF_NAME" | sed -n 's/^v\([0-9.]*\)-[0-9]*$/\1/p')
          [ -n "$VERSION" ] || { echo "bad tag $REF_NAME, want v1.1.6-1" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          curl -fsSL "https://plakar.io/dl/plakar_${VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin plakar
          plakar version

      - name: Build the plugins
        run: |
          grep -v '^\s*\(#\|$\)' plugins.txt | while read -r name; do
            plakar pkg build "$name"
          done
          sha256sum -- *.ptar > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: ptar
          path: |
            *.ptar
            SHA256SUMS

  test:
    needs: build
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux/rockylinux:10
            prep: 'true'
          - image: ubuntu:26.04
            prep: apt-get -qq update && apt-get -qq install -y curl ca-certificates
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ptar

      - name: Install the plugins
        env:
          V: ${{ needs.build.outputs.plakar }}
        run: |
          ${{ matrix.prep }}
          sha256sum -c SHA256SUMS
          curl -fsSL "https://plakar.io/dl/plakar_${V}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin plakar
          for p in *.ptar; do plakar pkg add -allow-unsigned "$p"; done
          plakar pkg show

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ptar

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            *.ptar
            SHA256SUMS

  image:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ptar
          path: image

      - name: Build and push the backup image
        env:
          V: ${{ needs.build.outputs.plakar }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/aforinnov/plakar-backup:${REF_NAME#v}"
          docker build --build-arg PLAKAR_VERSION="$V" -t "$image" image
          docker run --rm --entrypoint plakar "$image" pkg show
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$image"
